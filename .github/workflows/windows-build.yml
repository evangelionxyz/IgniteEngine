name: Windows Build C/C++

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository (with submodules)
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup MSVC
      uses: microsoft/setup-msbuild@v2

    - name: Install Vulkan SDK
      run: |
        $vulkanVersion = "1.4.328.1"
        $vulkanUrl = "https://sdk.lunarg.com/sdk/download/$vulkanVersion/windows/vulkansdk-windows-X64-$vulkanVersion.exe"
        $vulkanInstaller = "vulkansdk-$vulkanVersion.exe"
        
        Write-Host "Downloading Vulkan SDK $vulkanVersion..."
        Invoke-WebRequest -Uri $vulkanUrl -OutFile $vulkanInstaller
        
        Write-Host "Installing Vulkan SDK..."
        Start-Process -FilePath $vulkanInstaller -ArgumentList "/S" -Wait
        
        # Set environment variable for this job
        $vulkanPath = "C:\VulkanSDK\$vulkanVersion"
        echo "VULKAN_SDK=$vulkanPath" >> $env:GITHUB_ENV
        echo "VK_SDK_PATH=$vulkanPath" >> $env:GITHUB_ENV
        echo "$vulkanPath\Bin" >> $env:GITHUB_PATH

    - name: Install Premake5
      uses: abel0b/setup-premake@v2.4
      with:
        version: "5.0.0-beta7"

    - name: Generate Visual Studio Solution
      run: |
        premake5 vs2022 --file=scripts/premake5.lua

    - name: Build Ignite Engine
      run: |
        msbuild IGN.sln /p:Configuration=Release /p:Platform=x64 /m