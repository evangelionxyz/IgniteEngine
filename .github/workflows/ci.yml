name: CI Pipeline

on:
  push:
    branches: [ "master", "dev" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    name: Build (Windows container)
    # ── IMPORTANT ──────────────────────────────────────────────────────────
    # GitHub Actions does NOT support the `container:` key on Windows runners.
    # We pull the pre-built image from Docker Hub and run all build steps
    # inside the container using `docker run`, which is the only supported
    # approach for Windows containers in GitHub Actions.
    # ──────────────────────────────────────────────────────────────────────
    runs-on: windows-2022   # pinned – avoids surprise breakage from windows-latest updates

    steps:
      # ── 1. Source ────────────────────────────────────────────────────────
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ── 2. Auth ──────────────────────────────────────────────────────────
      # Pulls from Docker Hub to avoid rate limiting (even for public images)
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 3. Pull build container ──────────────────────────────────────────
      - name: Pull build image
        shell: pwsh
        run: |
          $image = "${{ secrets.DOCKERHUB_USERNAME }}/ignite-engine:latest"
          Write-Host "Pulling $image ..."
          docker pull $image
          if ($LASTEXITCODE -ne 0) { throw "docker pull failed" }
          Write-Host "Pulled $image"

      # ── 4. Build inside the container ────────────────────────────────────
      # The workspace is volume-mounted into C:\workspace (the WORKDIR set
      # in the Dockerfile). The script has full access to all baked-in SDKs.
      - name: Run build inside container
        shell: pwsh
        run: |
          $image     = "${{ secrets.DOCKERHUB_USERNAME }}/ignite-engine:latest"
          $workspace = ${{ github.workspace }}

          Write-Host "Running build in $image ..."
          Write-Host "Workspace: $workspace"

          docker run --rm `
            --volume "${workspace}:C:\workspace" `
            $image `
            powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass `
              -File "C:\workspace\scripts\docker_build.ps1"

          if ($LASTEXITCODE -ne 0) {
            throw "Container build failed (exit $LASTEXITCODE)"
          }

      # ── 5. Upload build artifacts ─────────────────────────────────────────
      - name: Upload build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ignite-engine-${{ github.sha }}
          path: bin/
          if-no-files-found: warn
          retention-days: 7
