name: CI-Pipeline

on:
  push:
    branches: [master, dev]

  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    env:
      VS_VERSION: "2026"
      PROJECT_FILE_EDITOR: ignite/editor/Ignite.Editor.vcxproj
      PROJECT_FILE_SCRIPTENGINE: scriptengine/Ignite.ScriptEngine.csproj
      SOLUTION_FILE_IGN: IGN.slnx
      PREMAKE_VERSION: 5.0.0-beta8

    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'

      - name: Checkout repository recursively (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Cache SDK downloads
        uses: actions/cache@v4
        with:
          path: scripts/downloads
          key: ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-${{ env.PREMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-
            ${{ runner.os }}-sdk-cache-v1-

      - name: Run Generate Script (Windows)
        shell: pwsh
        run: ./gen.bat

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.vcxproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages - Visual Studio
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_IGN /t:Restore /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" /v:n

      - name: Build Solution - Visual Studio
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_IGN /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" /v:m

  linux:
    name: Linux Build (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    env:
      PREMAKE_VERSION: 5.0.0-beta8
      CC: clang
      CXX: clang++

    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'

      - name: Checkout repository recursively (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Cache SDK downloads
        uses: actions/cache@v4
        with:
          path: scripts/downloads
          key: ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-${{ env.PREMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-
            ${{ runner.os }}-sdk-cache-v1-

      - name: Run Generate Script (Linux)
        run: |
          chmod +x gen.sh
          ./gen.sh

      - name: Install LLVM coverage tools
        if: matrix.configuration == 'Release'
        run: |
          sudo apt-get update && sudo apt-get install -y llvm
          LLVM_DIR=$(find /usr/lib/llvm* -maxdepth 2 -name "llvm-cov" 2>/dev/null | head -n 1 | xargs -r dirname)
          if [ -n "$LLVM_DIR" ]; then
            echo "$LLVM_DIR" >> "$GITHUB_PATH"
            sudo ln -sf "$LLVM_DIR/llvm-cov" /usr/local/bin/llvm-cov
            sudo ln -sf "$LLVM_DIR/llvm-profdata" /usr/local/bin/llvm-profdata
          fi

      - name: Install Sonar build wrapper
        if: matrix.configuration == 'Release'
        uses: SonarSource/sonarqube-scan-action/install-build-wrapper@v8
        env:
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Build Thirdparty Dependencies (Linux)
        run: |
          cmake -S thirdparty/SDL3 -B thirdparty/SDL3/build-linux \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF -DSDL_TESTS=OFF -DSDL_TEST_LIBRARY=OFF \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build thirdparty/SDL3/build-linux --config Release -j$(nproc)

          cmake -S thirdparty/FastNoise2 -B thirdparty/FastNoise2/build \
            -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ \
            -DBUILD_SHARED_LIBS=ON -DFASTNOISE2_STANDALONE_PROJECT=ON \
            -DFASTNOISE2_TOOLS=OFF -DFASTNOISE2_TESTS=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build thirdparty/FastNoise2/build --config Release -j$(nproc)

      - name: Build Native Targets (Linux)
        run: |
          CONFIG_LOWER=$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          if [ "${{ matrix.configuration }}" = "Release" ]; then
            COVERAGE_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
            build-wrapper-linux-x86-64 --out-dir build_wrapper_output_directory \
              make -j$(nproc) config=$CONFIG_LOWER \
                CFLAGS="$COVERAGE_FLAGS" \
                CXXFLAGS="$COVERAGE_FLAGS" \
                LDFLAGS="-fprofile-instr-generate" \
                Ignite.Editor Ignite.ScriptEngine Ignite.Test
          else
            make -j$(nproc) config=$CONFIG_LOWER Ignite.Editor Ignite.ScriptEngine Ignite.Test
          fi

      - name: Run Test Suite and Create Coverage Report
        if: matrix.configuration == 'Release'
        run: |
          LD_LIBRARY_PATH="$PWD/bin/Release:${LD_LIBRARY_PATH:-}" \
          LLVM_PROFILE_FILE="$PWD/coverage-%p.profraw" \
          ./bin/Release/Ignite.Test

          llvm-profdata merge -sparse coverage-*.profraw -o coverage.profdata

          > coverage.txt
          for target in ./bin/Release/Ignite.Test ./bin/Release/libIgnite.*.so; do
            if [ -f "$target" ]; then
              echo "Generating coverage for $target..."
              llvm-cov show "$target" \
                -instr-profile=coverage.profdata \
                -format=text >> coverage.txt || true
            fi
          done
          ls -lh coverage.txt

      - name: Cache SonarQube packages
        if: matrix.configuration == 'Release'
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        if: matrix.configuration == 'Release'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
        with:
          args: >
            -Dsonar.cfamily.compile-commands=${{ github.workspace }}/build_wrapper_output_directory/compile_commands.json
            -Dsonar.cfamily.llvm-cov.reportPath=${{ github.workspace }}/coverage.txt

  archlinux:
    name: Arch Linux Build (${{ matrix.configuration }})
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    steps:
      - name: Install Git & Basic Tools in Arch Container
        run: |
          pacman -Syu --noconfirm git sudo

      - name: Checkout repository recursively
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies via pacman
        run: |
          pacman -Syu --noconfirm --needed             base-devel gcc clang lld cmake ninja pkgconf git make tar             python python-pip vulkan-headers vulkan-icd-loader             sdl3 wayland libxkbcommon libx11 libxext libxrandr libxcursor             libxfixes libxi libxss libxtst libdrm mesa alsa-lib             pulseaudio zlib fmt libxml2 openexr imath glib2 gdb zenity             dotnet-sdk shaderc spirv-tools spirv-cross rust

      - name: Configure Git Safe Directory
        run: git config --global --add safe.directory "*"

      - name: Run Generate Script
        run: |
          chmod +x gen.sh
          ./gen.sh

      - name: Build Native Targets (Arch Linux)
        run: |
          CONFIG_LOWER=$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          make -j$(nproc) config=$CONFIG_LOWER Ignite.Editor Ignite.ScriptEngine Ignite.Test
