name: CI-Pipeline

on:
  push:
    branches: [master, dev]

  pull_request:
    branches: [master, dev]
    types: [opened, synchronize, reopened]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows Build (${{ matrix.configuration }})
    runs-on: windows-2025-vs2026
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    env:
      VS_VERSION: "2026"
      PROJECT_FILE_EDITOR: ignite/editor/Ignite.Editor.vcxproj
      PROJECT_FILE_SCRIPTENGINE: scriptengine/Ignite.ScriptEngine.csproj
      SOLUTION_FILE_IGN: IGN.slnx
      PREMAKE_VERSION: 5.0.0-beta8

    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'

      - name: Checkout repository recursively (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v3

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Cache SDK downloads
        uses: actions/cache@v4
        with:
          path: scripts/downloads
          key: ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-${{ env.PREMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-
            ${{ runner.os }}-sdk-cache-v1-

      - name: Run Generate Script (Windows)
        shell: pwsh
        run: ./gen.bat

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.vcxproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages - Visual Studio
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_IGN /t:Restore /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" /v:n

      - name: Build Solution - Visual Studio
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_IGN /t:Build /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" /v:m

  linux:
    name: Linux Build (${{ matrix.configuration }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [Release]
    env:
      PREMAKE_VERSION: 5.0.0-beta8

    steps:
      - name: Skip Duplicate Actions
        uses: fkirc/skip-duplicate-actions@v5
        with:
          concurrent_skipping: 'never'
          skip_after_successful_duplicate: 'true'

      - name: Checkout repository recursively (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: crates

      - name: Cache SDK downloads
        uses: actions/cache@v4
        with:
          path: scripts/downloads
          key: ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-${{ env.PREMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-
            ${{ runner.os }}-sdk-cache-v1-

      - name: Run Generate Script (Linux)
        run: |
          chmod +x gen.sh
          ./gen.sh

      - name: Build Editor (Linux)
        run: |
          CONFIG_LOWER=$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          make -j$(nproc) config=$CONFIG_LOWER Ignite.Editor

      - name: Build ScriptEngine (Linux)
        run: |
          CONFIG_LOWER=$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          make -j$(nproc) config=$CONFIG_LOWER Ignite.ScriptEngine

      - name: Build Test Suite (Linux)
        run: |
          CONFIG_LOWER=$(echo "${{ matrix.configuration }}" | tr '[:upper:]' '[:lower:]')
          make -j$(nproc) config=$CONFIG_LOWER Ignite.Test

  sonar:
    name: Sonar-Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
