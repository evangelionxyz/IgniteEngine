name: CI-Pipeline

on:
  push:
    branches: [master, dev]
  
  pull_request:
    branches: [master]

jobs:
   build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-2025-vs2026, ubuntu-latest]
        configuration: [Release]
    env:
      VS_VERSION: "2026"
      PROJECT_FILE_EDITOR: ignite/editor/Ignite.Editor.vcxproj
      PROJECT_FILE_SCRIPTENGINE: scriptengine/Ignite.ScriptEngine.csproj
      SOLUTION_FILE_IGN: IGN.slnx
      PREMAKE_VERSION: 5.0.0-beta8

    steps:
      - name: Checkout repository recursively (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Cache Python packages
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\pip\Cache
            ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Setup .NET 10 SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Setup MSBuild
        if: runner.os == 'Windows'
        uses: microsoft/setup-msbuild@v3

      - name: Cache SDK downloads
        uses: actions/cache@v4
        with:
          path: scripts/downloads
          key: ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-${{ env.PREMAKE_VERSION }}
          restore-keys: |
            ${{ runner.os }}-sdk-cache-v1-${{ hashFiles('scripts/setup_dependencies.py') }}-
            ${{ runner.os }}-sdk-cache-v1-

      - name: Run Generate Script (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./gen.bat

      - name: Run Generate Script (Linux)
        if: runner.os == 'Linux'
        run: |
          chmod +x gen.sh
          ./gen.sh

      - name: Cache NuGet packages
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.vcxproj') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Restore NuGet packages - Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_IGN /t:Restore /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" /v:n

      - name: Build Solution - Visual Studio
        if: runner.os == 'Windows'
        shell: pwsh
        run: msbuild $env:SOLUTION_FILE_IGN /t:Rebuild /p:Configuration=${{ matrix.configuration }} /p:Platform="x64" /v:m

      - name: Build Editor (Linux)
        if: runner.os == 'Linux'
        run: make -j$(nproc) Ignite.Editor

      - name: Build Test Suite (Linux)
        if: runner.os == 'Linux'
        run: make -j$(nproc) Ignite.Test
