name: Build & Push Docker Image

# Triggers only when the Dockerfile itself changes.
# This is the slow workflow (~30-60 min); it runs rarely.
on:
  push:
    branches: [ "master", "dev" ]
    paths:
      - "dockerfile"
      - ".dockerignore"
  workflow_dispatch:    # allow manual trigger from GitHub UI

jobs:
  build-and-push:
    name: Build Windows container & push to Docker Hub
    runs-on: windows-2022   # pinned – we need a Windows host for Windows containers

    steps:
      # ## 1. Source ########################################################
      - name: Checkout
        uses: actions/checkout@v4

      # ## 2. Auth ##########################################################
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ## 2.1 Start Docker #################################################
      # On windows-2022 runners, Docker is installed but the service can be
      # stopped or not fully initialized. We ensure it's started and ready.
      - name: Start Docker Service
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          Write-Host "Checking Docker service status..."
          $service = Get-Service -Name docker -ErrorAction SilentlyContinue
          if ($service) {
              if ($service.Status -ne 'Running') {
                  Write-Host "Starting Docker service..."
                  Start-Service -Name docker
              }
              Write-Host "Docker service is $($service.Status)."
          } else {
              Write-Warning "Docker service not found via Get-Service."
          }

          Write-Host "Verifying Docker connection..."
          $retryCount = 0
          while ($retryCount -lt 5) {
              docker info > $null 2>&1
              if ($LASTEXITCODE -eq 0) {
                  Write-Host "Docker is ready!"
                  break
              }
              Write-Host "Waiting for Docker daemon... (Attempt $($retryCount + 1))"
              Start-Sleep -Seconds 5
              $retryCount++
          }
          if ($retryCount -eq 5) {
              throw "Docker daemon failed to start after 25 seconds."
          }

      # ## 3. Build #########################################################
      # NOTE: BuildKit is NOT used here — it has known limitations with
      # Windows containers on GitHub-hosted runners.
      - name: Build Docker image
        shell: pwsh
        run: |
          $image   = "${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}"
          $tagSha  = "${image}:${{ github.sha }}"
          $tagLatest = "${image}:latest"

          Write-Host "Building $tagSha ..."
          docker build `
            --no-cache `
            --tag $tagSha `
            --tag $tagLatest `
            --file dockerfile `
            .

          if ($LASTEXITCODE -ne 0) {
            throw "docker build failed (exit $LASTEXITCODE)"
          }

      # ## 4. Push ##########################################################
      - name: Push to Docker Hub
        shell: pwsh
        run: |
          $image = "${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}"
          docker push "${image}:${{ github.sha }}"
          docker push "${image}:latest"
          Write-Host "Pushed ${image}:${{ github.sha }} and ${image}:latest"

      # ## 5. Summary #######################################################
      - name: Write job summary
        shell: pwsh
        run: |
          $image = "${{ vars.DOCKERHUB_USERNAME }}/${{ vars.DOCKERHUB_REPOSITORY }}"
          @"
          ## Docker image published

          | Tag | Value |
          |-----|-------|
          | ``:latest`` | ``${image}:latest`` |
          | SHA pin     | ``${image}:${{ github.sha }}`` |

          > Use the SHA tag in ``ci.yml`` when you need a pinned, immutable reference.
          "@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
