[workspace]
resolver = "2"
members = [
    "ignite_core",
    "ignite_asset",
    "ignite_ecs",
    "ignite_serial",
    "ignite_project",
]
default-members = ["ignite_core"]

[workspace.dependencies]
rand = "0.10.2"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
bincode = "1.3.3"
